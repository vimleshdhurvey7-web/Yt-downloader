name: Build and Extract YT Downloader

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Extract and Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract ZIP File Safely
        run: |
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Extracting $zipfile..."
              unzip -o -q "$zipfile" || 7z x "$zipfile" -y || echo "Warning: Could not extract $zipfile"
            fi
          done

      - name: Fix Directory Structure
        run: |
          if [ ! -f "gradlew" ] && [ ! -f "package.json" ] && [ ! -f "requirements.txt" ]; then
            SUB_DIR=$(find . -maxdepth 2 -name "gradlew" -o -name "package.json" -o -name "requirements.txt" | head -n 1)
            if [ -n "$SUB_DIR" ]; then
              DIR_NAME=$(dirname "$SUB_DIR")
              if [ "$DIR_NAME" != "." ]; then
                echo "Moving files from $DIR_NAME to root..."
                cp -r "$DIR_NAME"/* .
                cp -r "$DIR_NAME"/.[!.]* . 2>/dev/null || true
              fi
            fi
          fi

      # --- यहाँ से APK/App बिल्ड करने का प्रोसेस शुरू होता है (Android के लिए) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || echo "No gradlew found, skipping."

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || echo "Build failed or not an Android project"

      # --- यह सबसे महत्वपूर्ण स्टेप है जो डाउनलोड लिंक बनाएगा ---
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT_Downloader_App_APK
          # अगर आपकी APK कहीं और बनती है, तो यहाँ उसका पाथ बदल दें
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
